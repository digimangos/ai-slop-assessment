name: Feature request
description: Suggest an improvement to the assessment workflow.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Describe your proposed improvement
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context

name: Slop inventory (deterministic)
on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open pull request number
        required: true
        type: string
      force:
        description: Ignore an identical prior assessment
        type: boolean
        default: false
permissions: {}
concurrency:
  group: slop-inventory-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: false
jobs:
  inventory:
    if: github.event_name == 'workflow_dispatch' || vars.SLOP_MODEL_ENABLED != 'true' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      actions: read
    outputs:
      assessment_status: ${{ steps.publish.outputs.assessment_status }}
      overall_score: ${{ steps.publish.outputs.overall_score }}
      assessed_families: ${{ steps.publish.outputs.assessed_families }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check trusted installation
        id: installation
        run: |
          if test -f src/runtime.mjs; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Assessment unavailable: merge the trusted workflow helpers to the default branch before first use." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - id: prepare
        if: steps.installation.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SLOP_MODEL_ENABLED: "false"
          SLOP_CONFIG: ${{ vars.SLOP_CONFIG_PATH }}
          SLOP_EVIDENCE: ${{ vars.SLOP_EVIDENCE_PATH }}
        run: node src/runtime.mjs prepare
      - id: publish
        if: steps.prepare.outcome == 'success' && steps.prepare.outputs.duplicate != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node src/runtime.mjs publish
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.prepare.outputs.duplicate != 'true' }}
        with:
          name: slop-pr-${{ steps.prepare.outputs.pr_number }}
          path: |
            .slop/report.json
            .slop/report.md
          include-hidden-files: true
          retention-days: 14

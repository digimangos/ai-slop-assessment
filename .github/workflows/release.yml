name: Publish exact-version release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact release tag matching package.json (for example v1.1.0)
        required: true
        type: string
      immutable_confirmed:
        description: Immutable releases are enabled in repository settings
        required: true
        default: false
        type: boolean
permissions: {}
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Validate release identity
        id: identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          IMMUTABLE_CONFIRMED: ${{ inputs.immutable_confirmed }}
        run: |
          test "$IMMUTABLE_CONFIRMED" = true
          node scripts/release.mjs >> "$GITHUB_OUTPUT"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check && npm run format:check && npm test
      - name: Verify compiled workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/derive-org-workflow.mjs --check
          gh extension install github/gh-aw --pin v1.0.1
          gh aw compile slop-public --no-check-update --action-mode release --action-tag 0627fdbe4beb5f3b71aa569f8d97150b87f2111a
          gh aw compile slop-org --no-check-update --action-mode release --action-tag 0627fdbe4beb5f3b71aa569f8d97150b87f2111a
          git diff --exit-code -- .github/workflows/slop-public.lock.yml .github/workflows/slop-org.lock.yml
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - name: Create annotated tag and publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG: ${{ needs.validate.outputs.tag }}
          COMMIT: ${{ needs.validate.outputs.commit }}
        run: bash scripts/publish-release.sh

name: Publish exact-version release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Require a semver tag on trusted default-branch history
        id: source
        env:
          TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          COMMIT="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          git merge-base --is-ancestor "$COMMIT" "refs/remotes/origin/$DEFAULT_BRANCH"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
      - name: Test release packaging
        run: node --test test/release.test.mjs
      - name: Package the exact tag, not the working tree
        env:
          TAG: ${{ steps.source.outputs.tag }}
          COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          node scripts/release.mjs pack --ref "refs/tags/$TAG" --version "$TAG" --out release-dist
          node scripts/release.mjs verify --archive "release-dist/ai-slop-rating-$TAG.tar.gz" --checksums release-dist/SHA256SUMS --version "$TAG" --commit "$COMMIT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-dist/
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-dist/
      - name: Publish once, with assets attached before publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.package.outputs.tag }}
          COMMIT: ${{ needs.package.outputs.commit }}
        run: |
          test "$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)" = "$COMMIT"
          gh release create "$TAG" \
            "release-dist/ai-slop-rating-$TAG.tar.gz" \
            release-dist/SHA256SUMS \
            --verify-tag --target "$COMMIT" --title "$TAG" --generate-notes --draft
          gh release edit "$TAG" --draft=false
          if test "$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq .immutable)" != true; then
            echo "::error::Release immutability is not enabled. Enable it in repository settings before publishing any further releases; do not reuse this version."
            exit 1
          fi

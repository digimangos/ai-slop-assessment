name: Offline contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check && npm run format:check && npm test
      - name: Install pinned workflow compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-aw --pin v1.0.1
      - name: Verify workflow compilation and lock freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh aw compile slop-review --no-check-update --action-mode release --action-tag 0627fdbe4beb5f3b71aa569f8d97150b87f2111a
          git diff --exit-code -- .github/workflows/slop-review.lock.yml
